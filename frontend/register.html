<!DOCTYPE html>
<html lang="en" class="transition-all duration-300">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MediCare Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind config with Dark Mode setup
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#3b82f6'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'bounce-in': 'bounceIn 0.6s ease-out'
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Add necessary styles from f5.html */
        .medical-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            animation: bounceIn 0.6s ease-out;
        }

        .dark .login-card {
            background: rgba(31, 41, 55, 0.95);
        }
        
        /* Include keyframe styles here for CSS consistency */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .password-strength-weak { color: #ef4444; }
        .password-strength-medium { color: #f59e0b; }
        .password-strength-strong { color: #10b981; }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-all duration-300">
    <div id="loadingOverlay" class="fixed inset-0 bg-white dark:bg-gray-900 z-50 flex items-center justify-center hidden">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-gray-600 dark:text-gray-300">Loading...</p>
        </div>
    </div>
    <div id="notificationContainer"></div>
    
    <div class="fixed top-4 right-4 z-40">
        <button onclick="toggleDarkMode()" class="tooltip bg-white dark:bg-gray-800 p-3 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-200 dark:border-gray-700" data-tooltip="Toggle Dark Mode">
            <i id="darkModeIcon" class="fas fa-moon text-gray-600 dark:text-yellow-400"></i>
        </button>
    </div>

    <div class="fixed top-4 left-4 z-40 flex items-center space-x-2 bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow-lg border border-gray-200 dark:border-gray-700">
        <div class="medical-gradient w-8 h-8 rounded-full flex items-center justify-center">
            <i class="fas fa-heartbeat text-white text-sm"></i>
        </div>
        <span class="font-bold text-gray-800 dark:text-white text-sm">MediCare v10</span>
    </div>

    <div id="registerPage" class="hero-section flex items-center justify-center p-6">
        <div class="login-card rounded-2xl p-8 max-w-2xl w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="text-center mb-8">
                <div class="medical-gradient w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-user-plus text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Join MediCare</h1>
                <p class="text-gray-600 dark:text-gray-300">Create your healthcare account</p>
            </div>

            <form id="registerForm" class="space-y-6">
                <div class="text-center">
                    <div class="relative inline-block">
                        <div id="profilePreview" class="w-24 h-24 bg-gray-200 dark:bg-gray-600 rounded-full flex items-center justify-center mx-auto mb-4 overflow-hidden">
                            <i class="fas fa-user text-gray-400 text-2xl"></i>
                        </div>
                        <label for="profilePicture" class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full cursor-pointer hover:bg-blue-700 transition-colors">
                            <i class="fas fa-camera text-sm"></i>
                        </label>
                        <input type="file" id="profilePicture" accept="image/*" class="hidden" onchange="previewProfilePicture(this)">
                    </div>
                    <p class="text-sm text-gray-600 dark:text-gray-400">Upload profile picture (optional)</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="firstName">First Name</label>
                        <input type="text" id="firstName" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="John" aria-label="First Name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="lastName">Last Name</label>
                        <input type="text" id="lastName" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Smith" aria-label="Last Name">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="john.smith@email.com" aria-label="Email Address">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="(555) 123-4567" aria-label="Phone Number">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="dateOfBirth">Date of Birth</label>
                        <input type="date" id="dateOfBirth" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" aria-label="Date of Birth">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="registerRole">Register As</label>
                    <select id="registerRole" required class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" onchange="toggleMedicalLicense()" aria-label="Select registration role">
                        <option value="">Select your role</option>
                        <option value="patient">👤 Patient</option>
                        <option value="doctor">👨‍⚕️ Doctor (Requires Verification)</option>
                        <option value="nurse">👩‍⚕️ Nurse (Requires Verification)</option>
                    </select>
                </div>

                <div id="medicalLicense" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="licenseNumber">Medical License Number</label>
                    <input type="text" id="licenseNumber" class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Enter license number" aria-label="Medical License Number">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="registerPassword">Password</label>
                    <div class="relative">
                        <input type="password" id="registerPassword" required class="w-full p-3 pr-12 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Create a strong password" oninput="checkPasswordStrength(this.value)" aria-label="Password">
                        <button type="button" onclick="togglePasswordVisibility('registerPassword')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="registerPassword-icon"></i>
                        </button>
                    </div>
                    <div id="passwordStrength" class="mt-2 text-sm"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="confirmPassword">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" required class="w-full p-3 pr-12 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Confirm your password" oninput="checkPasswordMatch()" aria-label="Confirm Password">
                        <button type="button" onclick="togglePasswordVisibility('confirmPassword')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="confirmPassword-icon"></i>
                        </button>
                    </div>
                    <div id="passwordMatch" class="mt-2 text-sm"></div>
                </div>

                <div class="flex items-start">
                    <input type="checkbox" id="agreeTerms" required class="mt-1 mr-3 rounded border-gray-300 text-blue-600 focus:ring-blue-500" aria-label="Agree to terms">
                    <label for="agreeTerms" class="text-sm text-gray-600 dark:text-gray-300">
                        I agree to the <a href="#" class="text-blue-600 hover:text-blue-800 dark:text-blue-400">Terms of Service</a> and <a href="#" class="text-blue-600 hover:text-blue-800 dark:text-blue-400">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white py-3 px-4 rounded-lg hover:bg-green-700 transition-all font-medium shadow-lg hover:shadow-xl transform hover:scale-105">
                    <i class="fas fa-user-plus mr-2"></i>
                    Create Account
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600 dark:text-gray-300">Already have an account?</p>
                <button onclick="showPage('login.html')" class="text-blue-600 hover:text-blue-800 dark:text-blue-400 text-sm font-medium mt-2">
                    Sign In Here
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
