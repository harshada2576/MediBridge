<!DOCTYPE html>
<html lang="en" class="transition-all duration-300">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediCare Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind config with Dark Mode setup
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#3b82f6'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'bounce-in': 'bounceIn 0.6s ease-out'
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Add necessary styles from f5.html */
        .medical-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            animation: bounceIn 0.6s ease-out;
        }

        .dark .login-card {
            background: rgba(31, 41, 55, 0.95);
        }

        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        /* ... include all @keyframes from f5.html here for full fidelity ... */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); }
            40%, 50% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.2); }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-all duration-300">
    <div id="loadingOverlay" class="fixed inset-0 bg-white dark:bg-gray-900 z-50 flex items-center justify-center hidden">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-gray-600 dark:text-gray-300">Loading...</p>
        </div>
    </div>
    <div id="notificationContainer"></div>
    
    <div class="fixed top-4 right-4 z-40">
        <button onclick="toggleDarkMode()" class="tooltip bg-white dark:bg-gray-800 p-3 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-200 dark:border-gray-700" data-tooltip="Toggle Dark Mode">
            <i id="darkModeIcon" class="fas fa-moon text-gray-600 dark:text-yellow-400"></i>
        </button>
    </div>

    <div class="fixed top-4 left-4 z-40 flex items-center space-x-2 bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow-lg border border-gray-200 dark:border-gray-700">
        <div class="medical-gradient w-8 h-8 rounded-full flex items-center justify-center">
            <i class="fas fa-heartbeat text-white text-sm"></i>
        </div>
        <span class="font-bold text-gray-800 dark:text-white text-sm">MediCare v10</span>
    </div>

    <div id="loginPage" class="hero-section flex items-center justify-center p-6">
        <div class="login-card rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <div class="text-center mb-8">
                <div class="medical-gradient w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 relative">
                    <i class="fas fa-hospital text-white text-2xl"></i>
                    <div class="absolute inset-0 rounded-full bg-blue-400 opacity-30 pulse-ring"></div>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">MediCare Hospital</h1>
                <p class="text-gray-600 dark:text-gray-300">Advanced Healthcare Management System</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="loginEmail">Email Address</label>
                    <div class="relative">
                        <input type="email" id="loginEmail" required class="w-full p-3 pl-10 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Enter your email" aria-label="Email Address">
                        <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="loginPassword">Password</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required class="w-full p-3 pl-10 pr-12 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Enter your password" aria-label="Password">
                        <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
                        <button type="button" onclick="togglePasswordVisibility('loginPassword')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="loginPassword-icon"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="userRole">Login As</label>
                    <div class="relative">
                        <select id="userRole" required class="w-full p-3 pl-10 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all appearance-none" aria-label="Select your role">
                            <option value="">Select your role</option>
                            <option value="doctor">👨‍⚕️ Doctor</option>
                            <option value="patient">👤 Patient</option>
                            <option value="admin">⚙️ Administrator</option>
                            <option value="nurse">👩‍⚕️ Nurse</option>
                        </select>
                        <i class="fas fa-user-tag absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
                        <i class="fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" aria-label="Remember me">
                        <span class="ml-2 text-sm text-gray-600 dark:text-gray-300">Remember me</span>
                    </label>
                    <a href="#" onclick="showForgotPassword()" class="text-sm text-blue-600 hover:text-blue-800 dark:text-blue-400">Forgot Password?</a>
                </div>
                <button type="submit" class="w-full medical-gradient text-white py-3 px-4 rounded-lg hover:opacity-90 transition-all font-medium shadow-lg hover:shadow-xl transform hover:scale-105">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Sign In Securely
                </button>
            </form>

            <div class="mt-6 text-center">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-gray-800 text-gray-500">Demo Credentials</span>
                    </div>
                </div>
                <div class="mt-4 grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-blue-50 dark:bg-blue-900/20 p-2 rounded">
                        <p class="font-medium text-blue-800 dark:text-blue-300">Doctor</p>
                        <p class="text-blue-600 dark:text-blue-400">doctor@medicare.com</p>
                    </div>
                    <div class="bg-green-50 dark:bg-green-900/20 p-2 rounded">
                        <p class="font-medium text-green-800 dark:text-green-300">Patient</p>
                        <p class="text-green-600 dark:text-green-400">patient@medicare.com</p>
                    </div>
                    <div class="bg-purple-50 dark:bg-purple-900/20 p-2 rounded">
                        <p class="font-medium text-purple-800 dark:text-purple-300">Admin</p>
                        <p class="text-purple-600 dark:text-purple-400">admin@medicare.com</p>
                    </div>
                    <div class="bg-pink-50 dark:bg-pink-900/20 p-2 rounded">
                        <p class="font-medium text-pink-800 dark:text-pink-300">Nurse</p>
                        <p class="text-pink-600 dark:text-pink-400">nurse@medicare.com</p>
                    </div>
                </div>
                <p class="text-xs text-gray-500 mt-2">Password: password123</p>
            </div>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600 dark:text-gray-300 mb-4">Don't have an account?</p>
                <button onclick="showPage('register.html')" class="w-full bg-green-600 text-white py-3 px-4 rounded-lg hover:bg-green-700 transition-all font-medium shadow-lg hover:shadow-xl transform hover:scale-105">
                    <i class="fas fa-user-plus mr-2"></i>
                    Create New Account
                </button>
            </div>

            <div class="mt-6 text-center">
                <a onclick="showPage('role-selection.html')" class="text-blue-600 hover:text-blue-800 dark:text-blue-400 text-sm font-medium cursor-pointer">
                    Or browse by role →
                </a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
