<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediBridge Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .medical-gradient {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23f0f9ff' fill-opacity='0.4'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-50 bg-pattern min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Logo and Header -->
        <div class="text-center mb-8">
            <div class="medical-gradient w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-heartbeat text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">MediBridge Hospital</h1>
            <p class="text-gray-600">Sign in to your account</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8 card-hover">
            <!-- Role Selection -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-3">Login as:</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="patientRole" onclick="selectRole('patient')" 
                            class="role-btn flex items-center justify-center p-3 border-2 border-blue-200 rounded-lg hover:border-blue-400 transition-colors bg-blue-50 border-blue-500">
                        <i class="fas fa-user mr-2 text-blue-600"></i>
                        <span class="font-medium text-blue-600">Patient</span>
                    </button>
                    <button type="button" id="doctorRole" onclick="selectRole('doctor')" 
                            class="role-btn flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg hover:border-blue-400 transition-colors">
                        <i class="fas fa-user-md mr-2 text-gray-600"></i>
                        <span class="font-medium text-gray-600">Doctor</span>
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <div class="relative">
                            <input type="email" id="email" name="email" required
                                   class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Enter your email">
                            <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required
                                   class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   placeholder="Enter your password">
                            <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i id="passwordToggle" class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-blue-600 hover:text-blue-800">Forgot password?</a>
                    </div>

                    <button type="submit" 
                            class="w-full medical-gradient text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 transition-opacity">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In
                    </button>
                </div>
            </form>

            <!-- Divider -->
            <div class="my-6 flex items-center">
                <div class="flex-1 border-t border-gray-300"></div>
                <span class="px-4 text-sm text-gray-500">or</span>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>

            <!-- Register Link -->
            <div class="text-center">
                <p class="text-gray-600">Don't have an account?</p>
                <button onclick="goToRegister()" class="text-blue-600 hover:text-blue-800 font-medium">
                    Create new account
                </button>
            </div>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-6 bg-blue-50 rounded-lg p-4">
            <h3 class="font-medium text-blue-800 mb-2">Demo Credentials:</h3>
            <div class="text-sm text-blue-700 space-y-1">
                <p><strong>Patient:</strong> patient@demo.com / password123</p>
                <p><strong>Doctor:</strong> doctor@demo.com / password123</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-gray-500 text-sm">
            <p>&copy; 2024 MediBridge Hospital. All rights reserved.</p>
            <div class="mt-2 space-x-4">
                <a href="#" class="hover:text-blue-600">Privacy Policy</a>
                <a href="#" class="hover:text-blue-600">Terms of Service</a>
                <a href="#" class="hover:text-blue-600">Contact</a>
            </div>
        </div>
    </div>

    <script>
        let selectedRole = 'patient';

        function selectRole(role) {
            selectedRole = role;
            
            // Update button styles
            const patientBtn = document.getElementById('patientRole');
            const doctorBtn = document.getElementById('doctorRole');
            
            if (role === 'patient') {
                patientBtn.className = 'role-btn flex items-center justify-center p-3 border-2 border-blue-500 rounded-lg bg-blue-50 transition-colors';
                patientBtn.innerHTML = '<i class="fas fa-user mr-2 text-blue-600"></i><span class="font-medium text-blue-600">Patient</span>';
                
                doctorBtn.className = 'role-btn flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg hover:border-blue-400 transition-colors';
                doctorBtn.innerHTML = '<i class="fas fa-user-md mr-2 text-gray-600"></i><span class="font-medium text-gray-600">Doctor</span>';
            } else {
                doctorBtn.className = 'role-btn flex items-center justify-center p-3 border-2 border-blue-500 rounded-lg bg-blue-50 transition-colors';
                doctorBtn.innerHTML = '<i class="fas fa-user-md mr-2 text-blue-600"></i><span class="font-medium text-blue-600">Doctor</span>';
                
                patientBtn.className = 'role-btn flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg hover:border-blue-400 transition-colors';
                patientBtn.innerHTML = '<i class="fas fa-user mr-2 text-gray-600"></i><span class="font-medium text-gray-600">Patient</span>';
            }
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Demo authentication
            const demoCredentials = {
                patient: { email: 'patient@demo.com', password: 'password123' },
                doctor: { email: 'doctor@demo.com', password: 'password123' }
            };
            
            if (email === demoCredentials[selectedRole].email && password === demoCredentials[selectedRole].password) {
                // Store user info in localStorage
                localStorage.setItem('userRole', selectedRole);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('isLoggedIn', 'true');
                
                // Show success message
                showNotification('Login successful! Redirecting...', 'success');
                
                // Redirect after delay
                setTimeout(() => {
                    if (selectedRole === 'patient') {
                        window.location.href = 'patient-portal.html';
                    } else {
                        window.location.href = 'doctor-portal.html';
                    }
                }, 1500);
            } else {
                showNotification('Invalid credentials. Please try again.', 'error');
            }
        }

        function goToRegister() {
            window.location.href = 'register.html';
        }

        function showNotification(message, type) {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Auto-fill demo credentials on role change
        document.getElementById('patientRole').addEventListener('click', () => {
            document.getElementById('email').value = 'patient@demo.com';
            document.getElementById('password').value = 'password123';
        });

        document.getElementById('doctorRole').addEventListener('click', () => {
            document.getElementById('email').value = 'doctor@demo.com';
            document.getElementById('password').value = 'password123';
        });
    </script>

</html>
